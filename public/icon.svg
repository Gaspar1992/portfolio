<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente dorado Art Deco -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A962;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5E6D3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A962;stop-opacity:1" />
    </linearGradient>
    
    <!-- Patrón de fondo sutil -->
    <pattern id="decoPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#1A1A1A"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#2D2D2D" stroke-width="1"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#2D2D2D" stroke-width="1"/>
      <circle cx="20" cy="20" r="2" fill="#C9A962" opacity="0.3"/>
    </pattern>
    
    <!-- Filtro de sombra Art Deco -->
    <filter id="decoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Marco decorativo -->
    <rect id="frame" x="20" y="20" width="472" height="472" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  </defs>
  
  <!-- Fondo -->
  <rect width="512" height="512" fill="url(#decoPattern)"/>
  
  <!-- Marco exterior con esquinas decorativas -->
  <rect x="16" y="16" width="480" height="480" fill="none" stroke="#C9A962" stroke-width="3"/>
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="#C9A962" stroke-width="1" opacity="0.5"/>
  
  <!-- Esquinas decorativas Art Deco -->
  <!-- Superior izquierda -->
  <path d="M 16 80 L 16 16 L 80 16" fill="none" stroke="#C9A962" stroke-width="6"/>
  <path d="M 24 72 L 24 24 L 72 24" fill="none" stroke="#C9A962" stroke-width="2" opacity="0.6"/>
  
  <!-- Superior derecha -->
  <path d="M 432 16 L 496 16 L 496 80" fill="none" stroke="#C9A962" stroke-width="6"/>
  <path d="M 440 24 L 488 24 L 488 72" fill="none" stroke="#C9A962" stroke-width="2" opacity="0.6"/>
  
  <!-- Inferior izquierda -->
  <path d="M 16 432 L 16 496 L 80 496" fill="none" stroke="#C9A962" stroke-width="6"/>
  <path d="M 24 440 L 24 488 L 72 488" fill="none" stroke="#C9A962" stroke-width="2" opacity="0.6"/>
  
  <!-- Inferior derecha -->
  <path d="M 432 496 L 496 496 L 496 432" fill="none" stroke="#C9A962" stroke-width="6"/>
  <path d="M 440 488 L 488 488 L 488 440" fill="none" stroke="#C9A962" stroke-width="2" opacity="0.6"/>
  
  <!-- Elementos decorativos en los lados -->
  <circle cx="256" cy="40" r="8" fill="#C9A962"/>
  <circle cx="256" cy="472" r="8" fill="#C9A962"/>
  <circle cx="40" cy="256" r="8" fill="#C9A962"/>
  <circle cx="472" cy="256" r="8" fill="#C9A962"/>
  
  <!-- Líneas decorativas horizontales -->
  <line x1="100" y1="40" x2="212" y2="40" stroke="#C9A962" stroke-width="2"/>
  <line x1="300" y1="40" x2="412" y2="40" stroke="#C9A962" stroke-width="2"/>
  <line x1="100" y1="472" x2="212" y2="472" stroke="#C9A962" stroke-width="2"/>
  <line x1="300" y1="472" x2="412" y2="472" stroke="#C9A962" stroke-width="2"/>
  
  <!-- Inicial G - Estilo Art Deco -->
  <g transform="translate(80, 140)">
    <!-- Contorno decorativo de la G -->
    <path d="M 60 20 
             Q 10 20, 10 100 
             Q 10 180, 70 180
             Q 110 180, 110 140
             L 110 110
             L 70 110
             L 70 130
             L 90 130" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="8"
          stroke-linecap="round"
          filter="url(#decoShadow)"/>
    
    <!-- Línea horizontal de la G -->
    <line x1="50" y1="100" x2="100" y2="100" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Detalle decorativo interno -->
    <circle cx="70" cy="100" r="15" fill="none" stroke="#C9A962" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Inicial R - Estilo Art Deco -->
  <g transform="translate(240, 140)">
    <!-- Pie vertical de la R -->
    <line x1="20" y1="20" x2="20" y2="180" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" filter="url(#decoShadow)"/>
    
    <!-- Curva superior de la R -->
    <path d="M 20 20
             L 70 20
             Q 110 20, 110 60
             Q 110 100, 70 100
             L 20 100" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="8"
          stroke-linecap="round"
          filter="url(#decoShadow)"/>
    
    <!-- Pata diagonal de la R -->
    <line x1="60" y1="100" x2="100" y2="180" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" filter="url(#decoShadow)"/>
    
    <!-- Detalle decorativo - círculo en la curva -->
    <circle cx="65" cy="60" r="12" fill="none" stroke="#C9A962" stroke-width="2" opacity="0.5"/>
    
    <!-- Detalle Art Deco en la pata -->
    <circle cx="80" cy="140" r="6" fill="#C9A962" opacity="0.8"/>
  </g>
  
  <!-- Líneas decorativas inferiores (estilo años 30) -->
  <g transform="translate(0, 380)">
    <line x1="80" y1="0" x2="432" y2="0" stroke="#C9A962" stroke-width="1" opacity="0.4"/>
    <line x1="120" y1="15" x2="392" y2="15" stroke="#C9A962" stroke-width="2"/>
    <line x1="160" y1="30" x2="352" y2="30" stroke="#C9A962" stroke-width="1" opacity="0.4"/>
    
    <!-- Elemento decorativo central -->
    <polygon points="256,45 246,60 256,55 266,60" fill="#C9A962"/>
  </g>
  
  <!-- Texto decorativo inferior -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="Cinzel, serif" 
        font-size="14" 
        fill="#C9A962" 
        letter-spacing="8"
        opacity="0.8">PORTFOLIO</text>
  
  <!-- Efecto de película - perforaciones de film -->
  <g opacity="0.3">
    <rect x="32" y="60" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="32" y="100" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="32" y="140" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="32" y="180" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="32" y="220" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="32" y="260" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="32" y="300" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="32" y="340" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="32" y="380" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="32" y="420" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="32" y="460" width="8" height="12" rx="2" fill="#F5E6D3"/>
    
    <rect x="472" y="60" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="472" y="100" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="472" y="140" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="472" y="180" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="472" y="220" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="472" y="260" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="472" y="300" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="472" y="340" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="472" y="380" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="472" y="420" width="8" height="12" rx="2" fill="#F5E6D3"/>
    <rect x="472" y="460" width="8" height="12" rx="2" fill="#F5E6D3"/>
  </g>
</svg>
