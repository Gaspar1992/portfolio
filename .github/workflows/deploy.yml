name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate favicons
        run: node scripts/generate-favicon.mjs

      - name: Run unit tests
        run: pnpm test -- --watch=false

  build:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate favicons from SVG
        run: node scripts/generate-favicon.mjs

      - name: Build with SSG
        run: pnpm run build:ssg --base-href /portfolio/

      - name: Compress assets
        run: node scripts/compress-assets.mjs

      - name: Setup compression headers for GitHub Pages
        run: |
          # Create .nojekyll file
          touch dist/portfolio/browser/.nojekyll

          # Create _headers file for GitHub Pages
          cat > dist/portfolio/browser/_headers << 'EOF'
          # Enable compression for text-based files
          *.html
            Content-Encoding: gzip
            Cache-Control: public, max-age=0, must-revalidate

          *.css
            Content-Encoding: gzip
            Cache-Control: public, max-age=31536000, immutable

          *.js
            Content-Encoding: gzip
            Cache-Control: public, max-age=31536000, immutable

          *.json
            Content-Encoding: gzip
            Cache-Control: public, max-age=31536000, immutable

          *.svg
            Content-Encoding: gzip
            Cache-Control: public, max-age=31536000, immutable

          *.txt
            Content-Encoding: gzip
            Cache-Control: public, max-age=31536000, immutable

          # Security headers
          /*
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            X-XSS-Protection: 1; mode=block
            Referrer-Policy: strict-origin-when-cross-origin

          # Cache static assets
          *.woff2
            Cache-Control: public, max-age=31536000, immutable

          *.woff
            Cache-Control: public, max-age=31536000, immutable

          *.ttf
            Cache-Control: public, max-age=31536000, immutable

          *.png
            Cache-Control: public, max-age=31536000, immutable

          *.jpg
            Cache-Control: public, max-age=31536000, immutable

          *.jpeg
            Cache-Control: public, max-age=31536000, immutable

          *.webp
            Cache-Control: public, max-age=31536000, immutable

          *.ico
            Cache-Control: public, max-age=31536000, immutable
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
