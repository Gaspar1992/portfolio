name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job inicial: instala y cachea dependencias
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      - name: Generate favicons
        run: node scripts/generate-favicon.mjs

      - name: Upload node_modules
        uses: actions/upload-artifact@v6
        with:
          name: node_modules
          path: node_modules
          retention-days: 1

      - name: Upload favicons
        uses: actions/upload-artifact@v6
        with:
          name: favicons
          path: public/favicon*.png
          retention-days: 1

  # Tests unitarios
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Download favicons
        uses: actions/download-artifact@v4
        with:
          name: favicons
          path: public

      - name: Run unit tests
        run: npm test -- --watch=false

  # Tests E2E
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Download favicons
        uses: actions/download-artifact@v4
        with:
          name: favicons
          path: public

      - name: Restore Playwright cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Run E2E tests
        run: npm run test:e2e -- --reporter=line

  # Build y deploy solo si los tests pasan
  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Download favicons
        uses: actions/download-artifact@v4
        with:
          name: favicons
          path: public

      - name: Create .env file
        run: |
          if [ -n "${{ secrets.LINKEDIN_ACCESS_TOKEN }}" ]; then
            echo "LINKEDIN_ACCESS_TOKEN=${{ secrets.LINKEDIN_ACCESS_TOKEN }}" > .env
            echo "✅ .env file created with LINKEDIN_ACCESS_TOKEN"
          else
            touch .env
            echo "⚠️ LINKEDIN_ACCESS_TOKEN not set, created empty .env"
          fi

      - name: Build
        run: npm run build:prod -- --base-href /portfolio/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
