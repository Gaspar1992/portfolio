<main
  class="film-container snap-container pattern-deco"
  aria-label="Portfolio of Gaspar Rodriguez Valero"
>
  <!-- Skip link for accessibility -->
  <a href="#about" class="skip-link">Skip to main content</a>

  <!-- Film effects -->
  <div class="film-grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="film-stripes" aria-hidden="true"></div>
  <div class="dust-scratches" aria-hidden="true"></div>
  <div class="projector-flicker" aria-hidden="true"></div>

  <!-- Main navigation -->
  <app-navigation></app-navigation>

  <!-- Hero - carga inmediata -->
  <app-hero></app-hero>
  <!-- Sections -->
  @if (profile()) {
  <!-- About -->
  <app-about></app-about>

  <div class="film-strip-separator" aria-hidden="true"></div>

  <!-- Experience -->
  <app-experience></app-experience>

  <div class="film-strip-separator" aria-hidden="true"></div>

  <!-- Skills -->
  <app-skills></app-skills>

  <div class="film-strip-separator" aria-hidden="true"></div>

  <!-- Education -->
  <app-education></app-education>

  <div class="film-strip-separator" aria-hidden="true"></div>

  <!-- Projects -->
  <app-projects></app-projects>

  <div class="film-strip-separator" aria-hidden="true"></div>

  <!-- Certifications -->
  <app-certifications></app-certifications>

  <div class="film-strip-separator" aria-hidden="true"></div>

  <!-- Contact -->
  <app-contact></app-contact>
  }

  <!-- Section indicator for keyboard navigation -->
  <app-section-indicator></app-section-indicator>

  <!-- Keyboard shortcuts panel on right side -->
  <app-keyboard-shortcuts></app-keyboard-shortcuts>
</main>
