<div
  class="film-container snap-container pattern-deco"
  role="main"
  aria-label="Portfolio of Gaspar Rodriguez Valero"
>
  <!-- Skip link for accessibility -->
  <a href="#about" class="skip-link">Skip to main content</a>

  <!-- Film effects -->
  <div class="film-grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="film-stripes" aria-hidden="true"></div>
  <div class="dust-scratches" aria-hidden="true"></div>
  <div class="projector-flicker" aria-hidden="true"></div>

  <!-- Main navigation -->
  <nav class="main-nav" aria-label="Main navigation">
    <ul class="nav-list">
      <li><a href="#about" class="nav-link">About</a></li>
      <li><a href="#experience" class="nav-link">Experience</a></li>
      <li><a href="#skills" class="nav-link">Skills</a></li>
      <li><a href="#education" class="nav-link">Education</a></li>
      <li><a href="#projects" class="nav-link">Projects</a></li>
      <li><a href="#certifications" class="nav-link">Certifications</a></li>
      <li><a href="#contact" class="nav-link">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero - carga inmediata -->
  <app-hero [profile]="profile()"></app-hero>

  <!-- About - render immediately -->
  <app-about [profile]="profile()" id="about" tabindex="-1"></app-about>

  <!-- Experience - render immediately -->
  <app-experience [profile]="profile()" id="experience" tabindex="-1"></app-experience>

  <!-- Skills - render immediately -->
  <app-skills [profile]="profile()" id="skills" tabindex="-1"></app-skills>

  <!-- Education - render immediately -->
  <app-education [profile]="profile()" id="education" tabindex="-1"></app-education>

  <!-- Projects - render immediately -->
  <app-projects [profile]="profile()" id="projects" tabindex="-1"></app-projects>

  <!-- Certifications - render immediately -->
  <app-certifications [profile]="profile()" id="certifications" tabindex="-1"></app-certifications>

  <!-- Contact & Footer - render immediately for navigation -->
  <app-contact [profile]="profile()" id="contact" tabindex="-1"></app-contact>

  <!-- Section indicator for keyboard navigation -->
  <app-section-indicator></app-section-indicator>

  <!-- Keyboard shortcuts panel on right side -->
  <app-keyboard-shortcuts></app-keyboard-shortcuts>
</div>

<router-outlet></router-outlet>
