<main
  class="film-container snap-container pattern-deco"
  [attr.data-view-mode]="viewMode()"
  aria-label="Portfolio of Gaspar Rodriguez Valero"
>
  <!-- Skip link for accessibility -->
  <a href="#about" class="skip-link">Skip to main content</a>

  <!-- Film effects -->
  <div class="film-grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="film-stripes" aria-hidden="true"></div>
  <div class="dust-scratches" aria-hidden="true"></div>
  <div class="projector-flicker" aria-hidden="true"></div>

  <!-- Cinema Stage Decor: Auditorio de Época y Haz de Luz desde Atrás -->
  <div class="cinema-stage-environment" aria-hidden="true">
    <div class="cinema-theater-room">
      <div class="theater-backwall"></div>

      <!-- Arquitectura de pared lateral derecha en fuga -->
      <div class="theater-wall-right">
        <div class="wall-pilasters"></div>
        <div class="wall-boiserie"></div>
        <div class="theater-sconce">
          <div class="sconce-fixture"></div>
          <div class="sconce-glow"></div>
        </div>
      </div>

      <!-- Cabina de proyección en la parte superior posterior -->
      <div class="theater-projector-booth">
        <div class="booth-port"></div>
        <div class="booth-lens-glow"></div>
      </div>

      <!-- Moldura superior Art Deco -->
      <div class="theater-crown-moulding"></div>

      <!-- Base del proscenio bajo la pantalla -->
      <div class="theater-stage-apron">
        <div class="apron-screen-reflection"></div>
      </div>

      <!-- Matices de profundidad y halo ambiental -->
      <div class="theater-screen-ambient-glow"></div>
      <div class="theater-ambient-depth"></div>
    </div>
  </div>

  <!-- Main navigation -->
  <app-navigation></app-navigation>

  <!-- Cinema Stage Shell (desacoplado de las secciones) -->
  <div class="cinema-stage-wrapper">
    <div class="cinema-screen-frame">
      <!-- Projection beam: drawn in the screen plane so its edges always meet the frame corners -->
      <div class="cinema-beam" aria-hidden="true">
        <div class="cinema-beam-face cinema-beam-face-top"></div>
        <div class="cinema-beam-face cinema-beam-face-side"></div>
        <div class="cinema-beam-ridge"></div>
        <div class="cinema-beam-dust"></div>
      </div>
      <div class="cinema-screen-header" aria-hidden="true">
        <span class="screen-indicator">THEATER SCREEN • REEL 01</span>
        <span class="screen-hint">SCROLL / ARROWS TO CHANGE SLIDE</span>
      </div>

      <div class="cinema-screen-viewport">
        <!-- Hero - carga inmediata -->
        <app-hero class="cinema-slide"></app-hero>

        <!-- Sections -->
        @if (profile()) {
        <!-- About -->
        <app-about class="cinema-slide"></app-about>

        <div class="film-strip-separator" aria-hidden="true"></div>

        <!-- Experience -->
        <app-experience class="cinema-slide"></app-experience>

        <div class="film-strip-separator" aria-hidden="true"></div>

        <!-- Skills -->
        <app-skills class="cinema-slide"></app-skills>

        <div class="film-strip-separator" aria-hidden="true"></div>

        <!-- Education -->
        <app-education class="cinema-slide"></app-education>

        <div class="film-strip-separator" aria-hidden="true"></div>

        <!-- Projects -->
        <app-projects class="cinema-slide"></app-projects>

        <div class="film-strip-separator" aria-hidden="true"></div>

        <!-- Certifications -->
        <app-certifications class="cinema-slide"></app-certifications>

        <div class="film-strip-separator" aria-hidden="true"></div>

        <!-- Contact -->
        <app-contact class="cinema-slide"></app-contact>

        <!-- The End - Diapositiva final de clausura cinematográfica (solo activa en modo cine) -->
        <section
          class="cinema-slide cinema-the-end-slide"
          id="the-end"
          aria-label="End of film presentation"
        >
          <div class="the-end-frame">
            <span class="the-end-badge" aria-hidden="true">MCMXXVI • REEL FINALE</span>
            <h2 class="the-end-title">THE END</h2>
            <div class="divider-deco mb-4" aria-hidden="true">
              <div class="divider-icon">
                <span>✦</span>
              </div>
            </div>
            <p class="the-end-author">{{ profile()?.fullName | uppercase }}</p>
            <p class="the-end-credits">Designed in the style of the Golden Age of Cinema</p>
            <button
              class="btn-rewind"
              type="button"
              (click)="rewindToStart()"
              aria-label="Rewind to beginning of film"
            >
              <span aria-hidden="true">↺</span>
              <span>Rewind Reel</span>
            </button>
          </div>
        </section>
        }
      </div>
    </div>
  </div>

  <!-- Section indicator for keyboard navigation -->
  <app-section-indicator></app-section-indicator>

  <!-- Keyboard shortcuts panel on right side -->
  <app-keyboard-shortcuts></app-keyboard-shortcuts>
</main>
