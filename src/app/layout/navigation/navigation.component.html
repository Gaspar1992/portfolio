<nav class="main-nav" [class.mobile-open]="mobileMenuOpen()" aria-label="Main navigation">
  <!-- Mobile menu toggle button -->
  <button
    class="mobile-menu-toggle"
    type="button"
    (click)="toggleMobileMenu()"
    [attr.aria-expanded]="mobileMenuOpen()"
    aria-controls="nav-list"
    aria-label="Toggle navigation menu"
  >
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>

  <ul id="nav-list" class="nav-list">
    <li>
      <a href="#about" class="nav-link" (click)="navigateToSection('about', $event)">About</a>
    </li>
    <li>
      <a href="#experience" class="nav-link" (click)="navigateToSection('experience', $event)"
        >Experience</a
      >
    </li>
    <li>
      <a href="#skills" class="nav-link" (click)="navigateToSection('skills', $event)">Skills</a>
    </li>
    <li>
      <a href="#education" class="nav-link" (click)="navigateToSection('education', $event)"
        >Education</a
      >
    </li>
    <li>
      <a href="#projects" class="nav-link" (click)="navigateToSection('projects', $event)"
        >Projects</a
      >
    </li>
    <li>
      <a
        href="#certifications"
        class="nav-link"
        (click)="navigateToSection('certifications', $event)"
        >Certifications</a
      >
    </li>
    <li>
      <a href="#contact" class="nav-link" (click)="navigateToSection('contact', $event)">Contact</a>
    </li>
  </ul>

  <!-- Cinema / Classic View Mode Switcher -->
  <div class="nav-view-mode">
    <button
      class="view-mode-toggle"
      type="button"
      (click)="toggleViewMode()"
      [attr.aria-label]="isCinemaMode() ? 'Switch to classic view' : 'Switch to cinema view'"
      [attr.title]="isCinemaMode() ? 'Switch to classic view' : 'Switch to cinema view'"
      [class.cinema-active]="isCinemaMode()"
    >
      <span class="view-mode-icon" aria-hidden="true">{{ isCinemaMode() ? '🎬' : '📜' }}</span>
      <span class="view-mode-label">{{ isCinemaMode() ? 'Cinema Mode' : 'Classic Mode' }}</span>
    </button>
  </div>
</nav>
